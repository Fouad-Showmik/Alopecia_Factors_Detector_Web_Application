<button id="predictBtn">Test Prediction</button>
<button id="explainBtn">Test Explanation</button>

<pre id="result"></pre>

<script>
const API_URL =
    "https://alopecia-factors-detector-2dzf.onrender.com";

const data = {
    "Hair_washing": "yes",
    "Nutritional Deficiencies": "no",
    "Smoking": "no",
    "Job_role": "yes",
    "Genetics": "yes",
    "Stress": "yes",
    "Libido": "no",
    "Salary": "no",
    "Medications & Treatments": "yes",
    "Stay_up_late": "yes",
    "Weight Loss": "no",
    "Hair_grease": "yes",
    "Province": "yes"
};

document.getElementById("predictBtn").addEventListener("click", async () => {
    try {
        const response = await fetch(`${API_URL}/predict`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        document.getElementById("result").textContent =
            JSON.stringify(result, null, 2);

    } catch (error) {
        document.getElementById("result").textContent =
            error.toString();
    }
});

document.getElementById("explainBtn").addEventListener("click", async () => {
    try {
        const response = await fetch(`${API_URL}/explain`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        document.getElementById("result").textContent =
            JSON.stringify(result, null, 2);

    } catch (error) {
        document.getElementById("result").textContent =
            error.toString();
    }
});
</script>
